<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>알바 근무시간 정리기</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f6f7f9;
      color: #222;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .sub {
      color: #777;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      margin-top: 18px;
      border: none;
      background: #111;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button.delete {
      background: #eee;
      color: #333;
      margin-top: 0;
      padding: 8px 10px;
      width: auto;
    }

    .summary {
      display: grid;
      gap: 10px;
    }

    .summary-item {
      background: #f2f3f5;
      padding: 12px 14px;
      border-radius: 12px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #eee;
      text-align: center;
      font-size: 14px;
    }

    th {
      background: #fafafa;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>알바 근무시간 정리기</h1>
    <div class="sub">직원별 근무시간을 한 번에 기록하고 합계까지 확인해요.</div>

    <div class="card">
      <label>직원 이름</label>
      <input id="name" type="text" placeholder="예: 서윤" />

      <label>날짜</label>
      <input id="date" type="date" />

      <label>출근 시간</label>
      <input id="start" type="time" />

      <label>퇴근 시간</label>
      <input id="end" type="time" />

      <label>휴게시간</label>
      <select id="breakTime">
        <option value="0">없음</option>
        <option value="15">15분</option>
        <option value="30">30분</option>
        <option value="45">45분</option>
        <option value="60">1시간</option>
      </select>

      <button onclick="addWork()">근무 기록 추가</button>
    </div>

    <div class="card">
      <h2>직원별 총 근무시간</h2>
      <div id="summary" class="summary">
        <div class="empty">아직 기록이 없어요.</div>
      </div>
    </div>

    <div class="card">
      <h2>전체 근무 기록</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>직원</th>
              <th>날짜</th>
              <th>출근</th>
              <th>퇴근</th>
              <th>휴게</th>
              <th>실근무</th>
              <th>삭제</th>
            </tr>
          </thead>
          <tbody id="workList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let works = JSON.parse(localStorage.getItem("works") || "[]");

    function timeToMinutes(time) {
      const [hour, minute] = time.split(":").map(Number);
      return hour * 60 + minute;
    }

    function formatMinutes(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;

      if (h > 0 && m > 0) return `${h}시간 ${m}분`;
      if (h > 0) return `${h}시간`;
      return `${m}분`;
    }

    function addWork() {
      const name = document.getElementById("name").value.trim();
      const date = document.getElementById("date").value;
      const start = document.getElementById("start").value;
      const end = document.getElementById("end").value;
      const breakTime = Number(document.getElementById("breakTime").value);

      if (!name || !date || !start || !end) {
        alert("직원 이름, 날짜, 출근시간, 퇴근시간을 모두 입력해줘!");
        return;
      }

      let startMin = timeToMinutes(start);
      let endMin = timeToMinutes(end);

      if (endMin < startMin) {
        endMin += 24 * 60;
      }

      const total = endMin - startMin - breakTime;

      if (total <= 0) {
        alert("근무시간을 다시 확인해줘!");
        return;
      }

      works.push({
        id: Date.now(),
        name,
        date,
        start,
        end,
        breakTime,
        total
      });

      localStorage.setItem("works", JSON.stringify(works));

      document.getElementById("name").value = "";
      document.getElementById("start").value = "";
      document.getElementById("end").value = "";

      render();
    }

    function deleteWork(id) {
      works = works.filter(item => item.id !== id);
      localStorage.setItem("works", JSON.stringify(works));
      render();
    }

    function render() {
      const workList = document.getElementById("workList");
      const summary = document.getElementById("summary");

      workList.innerHTML = "";

      works
        .sort((a, b) => a.date.localeCompare(b.date))
        .forEach(item => {
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${item.name}</td>
            <td>${item.date}</td>
            <td>${item.start}</td>
            <td>${item.end}</td>
            <td>${item.breakTime}분</td>
            <td>${formatMinutes(item.total)}</td>
            <td>
              <button class="delete" onclick="deleteWork(${item.id})">삭제</button>
            </td>
          `;

          workList.appendChild(tr);
        });

      const totals = {};

      works.forEach(item => {
        totals[item.name] = (totals[item.name] || 0) + item.total;
      });

      summary.innerHTML = "";

      const names = Object.keys(totals);

      if (names.length === 0) {
        summary.innerHTML = `<div class="empty">아직 기록이 없어요.</div>`;
        return;
      }

      names.forEach(name => {
        const div = document.createElement("div");
        div.className = "summary-item";
        div.innerHTML = `<strong>${name}</strong> · ${formatMinutes(totals[name])}`;
        summary.appendChild(div);
      });
    }

    render();
  </script>
</body>
</html>
