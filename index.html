<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>알바 근무시간 정리기</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #222;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .sub {
      color: #777;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      margin-top: 16px;
      background: #111;
      color: white;
      border: none;
      font-weight: 700;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .danger {
      background: #f1f1f1;
      color: #444;
      margin-top: 0;
      width: auto;
      padding: 7px 10px;
    }

    .employee-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .employee-name {
      background: #f4f5f7;
      padding: 10px 12px;
      border-radius: 10px;
    }

    .summary-item {
      background: #f2f3f5;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #eee;
      text-align: center;
      font-size: 14px;
    }

    th {
      background: #fafafa;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 18px;
    }

    .note {
      font-size: 13px;
      color: #777;
      margin-top: 8px;
      line-height: 1.5;
    }

    .extra {
      font-weight: 700;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>알바 근무시간 정리기</h1>
  <div class="sub">직원별 근무시간과 추가근무를 한 번에 정리해요.</div>

  <div class="card">
    <h2>직원 관리</h2>

    <label>직원 이름 추가</label>
    <input id="newEmployee" type="text" placeholder="예: 서윤" />

    <button onclick="addEmployee()">직원 추가</button>

    <div id="employeeList" style="margin-top:16px;"></div>
  </div>

  <div class="card">
    <h2>근무 기록 추가</h2>

    <label>직원</label>
    <select id="name">
      <option value="">직원을 선택하세요</option>
    </select>

    <label>날짜</label>
    <input id="date" type="date" />

    <label>포지션</label>
    <select id="position">
      <option value="오픈">오픈</option>
      <option value="미들">미들</option>
      <option value="마감">마감</option>
      <option value="기타">기타</option>
    </select>

    <label>출근 시간</label>
    <input id="start" type="time" />

    <label>실제 퇴근 시간</label>
    <input id="end" type="time" />

    <label>예정 퇴근 시간 <span style="font-weight:400;color:#888;">(선택)</span></label>
    <input id="plannedEnd" type="time" />

    <div class="note">
      마감처럼 예정 퇴근시간을 정확히 모르면 비워둬도 돼요.
      예정 퇴근시간을 입력한 경우에만 추가근무를 계산해요.
    </div>

    <button onclick="addWork()">근무 기록 추가</button>
  </div>

  <div class="card">
    <h2>월별 보기</h2>

    <div class="filter-row">
      <input id="monthFilter" type="month" onchange="render()" />

      <button class="secondary" style="margin:0;" onclick="clearFilter()">
        전체 보기
      </button>
    </div>
  </div>

  <div class="card">
    <h2>직원별 합계</h2>
    <div id="summary">
      <div class="empty">아직 기록이 없어요.</div>
    </div>
  </div>

  <div class="card">
    <h2>전체 근무 기록</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>직원</th>
            <th>날짜</th>
            <th>포지션</th>
            <th>출근</th>
            <th>실제 퇴근</th>
            <th>예정 퇴근</th>
            <th>실근무</th>
            <th>추가근무</th>
            <th>삭제</th>
          </tr>
        </thead>

        <tbody id="workList"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  let employees = JSON.parse(localStorage.getItem("employees") || "[]");
  let works = JSON.parse(localStorage.getItem("works") || "[]");

  function saveEmployees() {
    localStorage.setItem("employees", JSON.stringify(employees));
  }

  function saveWorks() {
    localStorage.setItem("works", JSON.stringify(works));
  }

  function timeToMinutes(time) {
    const [hour, minute] = time.split(":").map(Number);
    return hour * 60 + minute;
  }

  function formatMinutes(minutes) {
    if (!minutes || minutes <= 0) return "0분";

    const h = Math.floor(minutes / 60);
    const m = minutes % 60;

    if (h > 0 && m > 0) return `${h}시간 ${m}분`;
    if (h > 0) return `${h}시간`;
    return `${m}분`;
  }

  function addEmployee() {
    const input = document.getElementById("newEmployee");
    const name = input.value.trim();

    if (!name) {
      alert("직원 이름을 입력해줘!");
      return;
    }

    if (employees.includes(name)) {
      alert("이미 있는 직원이에요.");
      return;
    }

    employees.push(name);
    saveEmployees();

    input.value = "";
    renderEmployees();
  }

  function deleteEmployee(name) {
    if (!confirm(`${name} 직원을 목록에서 삭제할까요?\n과거 근무 기록은 그대로 남아요.`)) {
      return;
    }

    employees = employees.filter(item => item !== name);
    saveEmployees();
    renderEmployees();
  }

  function renderEmployees() {
    const employeeList = document.getElementById("employeeList");
    const select = document.getElementById("name");

    employeeList.innerHTML = "";
    select.innerHTML = `<option value="">직원을 선택하세요</option>`;

    if (employees.length === 0) {
      employeeList.innerHTML = `<div class="empty">직원을 먼저 추가해줘요.</div>`;
    }

    employees.forEach(name => {
      const row = document.createElement("div");
      row.className = "employee-row";

      row.innerHTML = `
        <div class="employee-name">${name}</div>
        <button class="danger" onclick="deleteEmployee('${name}')">삭제</button>
      `;

      employeeList.appendChild(row);

      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });
  }

  function addWork() {
    const name = document.getElementById("name").value;
    const date = document.getElementById("date").value;
    const position = document.getElementById("position").value;
    const start = document.getElementById("start").value;
    const end = document.getElementById("end").value;
    const plannedEnd = document.getElementById("plannedEnd").value;

    if (!name || !date || !start || !end) {
      alert("직원, 날짜, 출근시간, 실제 퇴근시간을 모두 입력해줘!");
      return;
    }

    let startMin = timeToMinutes(start);
    let endMin = timeToMinutes(end);

    if (endMin < startMin) {
      endMin += 1440;
    }

    const total = endMin - startMin;

    if (total <= 0) {
      alert("근무시간을 다시 확인해줘!");
      return;
    }

    let extra = 0;

    if (plannedEnd) {
      let plannedEndMin = timeToMinutes(plannedEnd);

      if (plannedEndMin < startMin) {
        plannedEndMin += 1440;
      }

      if (endMin > plannedEndMin) {
        extra = endMin - plannedEndMin;
      }
    }

    works.push({
      id: Date.now(),
      name,
      date,
      position,
      start,
      end,
      plannedEnd,
      total,
      extra
    });

    saveWorks();

    document.getElementById("name").value = "";
    document.getElementById("start").value = "";
    document.getElementById("end").value = "";
    document.getElementById("plannedEnd").value = "";

    render();
  }

  function deleteWork(id) {
    if (!confirm("이 기록을 삭제할까요?")) return;

    works = works.filter(item => item.id !== id);
    saveWorks();
    render();
  }

  function clearFilter() {
    document.getElementById("monthFilter").value = "";
    render();
  }

  function render() {
    const workList = document.getElementById("workList");
    const summary = document.getElementById("summary");
    const monthFilter = document.getElementById("monthFilter").value;

    let filteredWorks = [...works];

    if (monthFilter) {
      filteredWorks = works.filter(item => item.date.startsWith(monthFilter));
    }

    filteredWorks.sort((a, b) => a.date.localeCompare(b.date));

    workList.innerHTML = "";

    if (filteredWorks.length === 0) {
      workList.innerHTML = `
        <tr>
          <td colspan="9" class="empty">기록이 없어요.</td>
        </tr>
      `;
    }

    filteredWorks.forEach(item => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${item.name}</td>
        <td>${item.date}</td>
        <td>${item.position || "-"}</td>
        <td>${item.start}</td>
        <td>${item.end}</td>
        <td>${item.plannedEnd || "-"}</td>
        <td>${formatMinutes(item.total)}</td>
        <td class="extra">${item.extra > 0 ? formatMinutes(item.extra) : "-"}</td>
        <td>
          <button class="danger" onclick="deleteWork(${item.id})">삭제</button>
        </td>
      `;

      workList.appendChild(tr);
    });

    const totals = {};

    filteredWorks.forEach(item => {
      if (!totals[item.name]) {
        totals[item.name] = {
          total: 0,
          extra: 0
        };
      }

      totals[item.name].total += item.total;
      totals[item.name].extra += item.extra || 0;
    });

    summary.innerHTML = "";

    const names = Object.keys(totals);

    if (names.length === 0) {
      summary.innerHTML = `<div class="empty">아직 기록이 없어요.</div>`;
      return;
    }

    names.forEach(name => {
      const div = document.createElement("div");
      div.className = "summary-item";

      div.innerHTML = `
        <strong>${name}</strong><br>
        총 근무 ${formatMinutes(totals[name].total)}
        · 추가근무 ${formatMinutes(totals[name].extra)}
      `;

      summary.appendChild(div);
    });
  }

  renderEmployees();
  render();
</script>

</body>
</html>
