<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>알바 근무시간 정리기</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#222}
.wrap{max-width:760px;margin:auto;padding:18px}
h1{font-size:27px;margin:0 0 6px}
h2{font-size:19px;margin:0}
.sub,.note{color:#777;font-size:13px;line-height:1.5}
.sub{margin-bottom:18px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #0000000d}
details.card{padding:0;overflow:hidden}
details.card summary{padding:16px;font-weight:800;cursor:pointer;list-style:none}
details.card summary:after{content:"보기";float:right;color:#777;font-size:13px}
details[open] summary:after{content:"접기"}
.inner{padding:0 16px 16px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input,select,button{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:11px;font-size:16px;background:#fff}
button{border:0;background:#111;color:#fff;font-weight:800;margin-top:12px}
.secondary,.danger{background:#eee;color:#222}
.small{width:auto;margin:0;padding:8px 10px;font-size:13px}
.row2,.filter{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}
.empName,.person{background:#f4f5f7;border-radius:11px;padding:11px}
.calendar,.schedule{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.week{font-size:12px;text-align:center;color:#777;font-weight:700;padding:4px}
.day{aspect-ratio:1;border:1px solid #ddd;background:#fff;color:#222;margin:0;padding:0;border-radius:10px;font-weight:700}
.day.sel{background:#111;color:#fff}
.blank{border:0;background:transparent}
.count{font-size:13px;color:#777;margin-top:8px}
.gen{background:#f7f7f8;border-radius:12px;padding:12px;margin-top:8px}
.gen b{display:block;margin-bottom:5px}
.person{margin-top:9px}
.personTop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.total{font-size:13px;color:#666;margin-top:4px}
.records,.edit{display:none}
.records.open,.edit.open{display:block}
.record{background:#fff;border:1px solid #e8e8e8;border-radius:11px;padding:10px;margin-top:8px}
.meta{font-size:13px;color:#666;line-height:1.5;margin-top:3px}
.actions{display:flex;gap:6px;margin-top:9px}
.actions button{flex:1}
.scheduleDay{min-height:94px;background:#f7f7f8;border-radius:9px;padding:6px;font-size:11px}
.scheduleDate{font-weight:900;margin-bottom:4px}
.shift{background:#fff;border-radius:6px;padding:4px;margin-top:3px;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden;text-align:left}
.pos{font-weight:800;flex:none}
.nm{font-weight:400;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:#999;font-size:14px;padding:12px}
</style>
</head>
<body>

<div class="wrap">
<h1>알바 근무시간 정리기</h1>
<div class="sub">근무기록을 저장하고 수정하면 아래 월간 스케줄에도 자동 반영돼요.</div>

<details class="card">
<summary>직원 관리</summary>
<div class="inner">
<label>직원 이름</label>
<input id="newEmp" placeholder="예: 서윤">
<button onclick="addEmp()">직원 추가</button>
<div id="empList"></div>
</div>
</details>

<div class="card">
<h2>근무일 입력</h2>

<label>직원</label>
<select id="emp"></select>

<label>포지션</label>
<select id="pos">
<option>오픈</option>
<option>오전미들</option>
<option>오후미들</option>
<option>미들</option>
<option>마감</option>
<option>교육</option>
</select>

<label>월 선택</label>
<input id="month" type="month">
<div id="cal"></div>
<div id="count" class="count">선택된 날짜 0일</div>

<div class="row2">
<div><label>기본 출근</label><input id="start" type="time"></div>
<div><label>기본 퇴근</label><input id="end" type="time"></div>
</div>

<button onclick="prepare()">선택한 날짜 확인</button>
</div>

<details id="previewCard" class="card" style="display:none" open>
<summary>저장 전 확인/수정</summary>
<div class="inner">
<div class="note">퇴근시간이 다른 날만 수정한 뒤 저장하면 돼요.</div>
<div id="preview"></div>
<button onclick="saveWorks()">전체 근무 기록 저장</button>
</div>
</details>

<div class="card">
<h2>근무기록</h2>
<div class="filter" style="margin-top:12px">
<input id="filterMonth" type="month">
<button class="secondary" style="margin:0" onclick="clearFilter()">전체 보기</button>
</div>
<div id="records"></div>
</div>

<div class="card">
<h2>월간 스케줄 달력</h2>
<input id="scheduleMonth" type="month" style="margin-top:12px">
<div class="note">저장된 기록에서 시간은 빼고 포지션 + 이름만 보여줘요.</div>
<div id="schedule"></div>
</div>
</div>

<script>
let employees=JSON.parse(localStorage.getItem("employees")||"[]");
let works=JSON.parse(localStorage.getItem("works")||"[]");
let settings=JSON.parse(localStorage.getItem("shiftSettings")||"{}");
let selected=[],temp=[];

const POS=["오픈","오전미들","오후미들","미들","마감","교육"];

function saveData(){
 localStorage.setItem("employees",JSON.stringify(employees));
 localStorage.setItem("works",JSON.stringify(works));
}

function saveSettings(){
 ["emp","pos","month","start","end","filterMonth","scheduleMonth"].forEach(id=>{
  let e=document.getElementById(id);if(e)settings[id]=e.value;
 });
 localStorage.setItem("shiftSettings",JSON.stringify(settings));
}

function restore(){
 Object.keys(settings).forEach(id=>{
  let e=document.getElementById(id);if(e)e.value=settings[id];
 });
}

function esc(s){
 return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function addEmp(){
 let v=newEmp.value.trim();
 if(!v)return alert("직원 이름을 입력해줘!");
 if(employees.includes(v))return alert("이미 있어요.");
 employees.push(v);newEmp.value="";saveData();renderEmp();
}

function delEmp(n){
 if(!confirm(n+" 직원을 목록에서 삭제할까요?\n기존 기록은 남아요."))return;
 employees=employees.filter(x=>x!==n);saveData();renderEmp();
}

function renderEmp(){
 emp.innerHTML='<option value="">직원을 선택하세요</option>';
 empList.innerHTML="";
 employees.forEach(n=>{
  emp.innerHTML+=`<option value="${esc(n)}">${esc(n)}</option>`;
  empList.innerHTML+=`<div class="empRow"><div class="empName">${esc(n)}</div><button class="small danger" onclick='delEmp(${JSON.stringify(n)})'>삭제</button></div>`;
 });
 if(!employees.length)empList.innerHTML='<div class="empty">직원을 먼저 추가해주세요.</div>';
 if(settings.emp&&employees.includes(settings.emp))emp.value=settings.emp;
}

function buildCal(){
 selected=[];
 let v=month.value;
 count.textContent="선택된 날짜 0일";
 cal.innerHTML="";
 if(!v)return;
 let [y,m]=v.split("-").map(Number),first=new Date(y,m-1,1).getDay(),last=new Date(y,m,0).getDate();
 let h='<div class="calendar">'+["일","월","화","수","목","금","토"].map(x=>`<div class="week">${x}</div>`).join("");
 for(let i=0;i<first;i++)h+='<button class="day blank"></button>';
 for(let d=1;d<=last;d++){
  let date=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  h+=`<button class="day" id="d${d}" onclick="toggleDay('${date}',${d})">${d}</button>`;
 }
 cal.innerHTML=h+"</div>";
 saveSettings();
}

function toggleDay(date,d){
 let b=document.getElementById("d"+d);
 if(selected.includes(date)){selected=selected.filter(x=>x!==date);b.classList.remove("sel")}
 else{selected.push(date);selected.sort();b.classList.add("sel")}
 count.textContent=`선택된 날짜 ${selected.length}일`;
}

function prepare(){
 if(!emp.value)return alert("직원을 선택해줘!");
 if(!selected.length)return alert("날짜를 선택해줘!");
 if(!start.value||!end.value)return alert("출퇴근 시간을 입력해줘!");
 saveSettings();
 temp=selected.map(date=>({date,name:emp.value,position:pos.value,start:start.value,end:end.value}));
 preview.innerHTML=temp.map((x,i)=>`
 <div class="gen"><b>${dateText(x.date)}</b>
 <div class="note">${esc(x.name)} · ${esc(x.position)} · 출근 ${x.start}</div>
 <input type="time" value="${x.end}" onchange="temp[${i}].end=this.value">
 </div>`).join("");
 previewCard.style.display="block";
 previewCard.open=true;
}

function mins(s,e){
 let[a,b]=s.split(":").map(Number),[c,d]=e.split(":").map(Number);
 let x=a*60+b,y=c*60+d;if(y<x)y+=1440;return y-x;
}

function saveWorks(){
 temp.forEach(x=>works.push({...x,id:Date.now()+Math.random(),total:mins(x.start,x.end)}));
 saveData();temp=[];previewCard.style.display="none";renderAll();alert("저장됐어요!");
}

function toggleRecords(id){document.getElementById(id).classList.toggle("open")}
function toggleEdit(id){document.getElementById("edit"+id).classList.toggle("open")}

function updateRecord(id){
 let w=works.find(x=>String(x.id)===String(id));if(!w)return;
 let p=document.getElementById("p"+id),s=document.getElementById("s"+id),e=document.getElementById("e"+id);
 if(!s.value||!e.value)return alert("출퇴근 시간을 확인해줘!");
 w.position=p.value;w.start=s.value;w.end=e.value;w.total=mins(w.start,w.end);
 saveData();renderAll();alert("수정됐어요!");
}

function delWork(id){
 if(!confirm("이 기록을 삭제할까요?"))return;
 works=works.filter(x=>String(x.id)!==String(id));saveData();renderAll();
}

function renderRecords(){
 let f=filterMonth.value?works.filter(x=>x.date.startsWith(filterMonth.value)):works;
 let g={};
 f.sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{
  if(!g[x.name])g[x.name]=[];g[x.name].push(x);
 });
 records.innerHTML="";
 if(!Object.keys(g).length){records.innerHTML='<div class="empty">아직 기록이 없어요.</div>';return}
 Object.entries(g).forEach(([name,arr],i)=>{
  let total=arr.reduce((a,x)=>a+Number(x.total||0),0),rid="r"+i;
  let body=arr.map(x=>{
   let opts=POS.map(p=>`<option ${x.position===p?"selected":""}>${p}</option>`).join("");
   return `<div class="record">
   <b>${dateText(x.date)}</b>
   <div class="meta">${esc(x.position)} · ${x.start} → ${x.end}<br>${timeText(x.total)}</div>
   <div class="actions">
   <button class="small secondary" onclick="toggleEdit('${x.id}')">기록 수정</button>
   <button class="small danger" onclick="delWork('${x.id}')">삭제</button>
   </div>
   <div class="edit" id="edit${x.id}">
   <label>포지션</label><select id="p${x.id}">${opts}</select>
   <label>출근시간</label><input id="s${x.id}" type="time" value="${x.start}">
   <label>퇴근시간</label><input id="e${x.id}" type="time" value="${x.end}">
   <button onclick="updateRecord('${x.id}')">수정 저장</button>
   </div></div>`;
  }).join("");
  records.innerHTML+=`<div class="person"><div class="personTop">
  <div><b>${esc(name)}</b><div class="total">${arr.length}일 · 총 ${timeText(total)}</div></div>
  <button class="small secondary" onclick="toggleRecords('${rid}')">상세보기</button>
  </div><div class="records" id="${rid}">${body}</div></div>`;
 });
}

function clearFilter(){filterMonth.value="";saveSettings();renderRecords()}

function renderSchedule(){
 let v=scheduleMonth.value;if(!v)return;
 let[y,m]=v.split("-").map(Number),first=new Date(y,m-1,1).getDay(),last=new Date(y,m,0).getDate();
 let map={};
 works.filter(x=>x.date.startsWith(v)).sort((a,b)=>order(a.position)-order(b.position)).forEach(x=>{
  if(!map[x.date])map[x.date]=[];map[x.date].push(x);
 });
 let h='<div class="schedule">'+["일","월","화","수","목","금","토"].map(x=>`<div class="week">${x}</div>`).join("");
 for(let i=0;i<first;i++)h+='<div class="scheduleDay blank"></div>';
 for(let d=1;d<=last;d++){
  let date=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  let lines=(map[date]||[]).map(x=>`<div class="shift"><span class="pos">${esc(x.position)}</span><span class="nm">${esc(x.name)}</span></div>`).join("");
  h+=`<div class="scheduleDay"><div class="scheduleDate">${d}</div>${lines}</div>`;
 }
 schedule.innerHTML=h+"</div>";saveSettings();
}

function order(p){return {"오픈":1,"오전미들":2,"미들":3,"오후미들":4,"마감":5,"교육":6}[p]||99}
function dateText(d){let a=d.split("-");return `${Number(a[1])}월 ${Number(a[2])}일`}
function timeText(n){n=Number(n||0);let h=Math.floor(n/60),m=n%60;return h&&m?`${h}시간 ${m}분`:h?`${h}시간`:`${m}분`}
function renderAll(){renderRecords();renderSchedule()}

renderEmp();
restore();

if(!scheduleMonth.value){
 let n=new Date();scheduleMonth.value=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
}
if(month.value)buildCal();

["emp","pos","start","end"].forEach(id=>document.getElementById(id).addEventListener("change",saveSettings));
month.addEventListener("change",buildCal);
filterMonth.addEventListener("change",()=>{saveSettings();renderRecords()});
scheduleMonth.addEventListener("change",renderSchedule);

renderAll();
</script>
</body>
</html>
