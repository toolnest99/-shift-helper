<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알바 근무시간 정리기</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #222;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .sub {
      color: #777;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      margin-top: 16px;
      border: none;
      background: #111;
      color: white;
      font-weight: 700;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .employee-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    .employee-name {
      background: #f4f5f7;
      padding: 11px;
      border-radius: 10px;
    }

    .delete {
      width: auto;
      margin: 0;
      padding: 8px 10px;
      background: #eee;
      color: #444;
    }

    .date-range {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .generated-row {
      background: #f7f7f8;
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
    }

    .generated-date {
      font-weight: 800;
      margin-bottom: 8px;
    }

    .generated-info {
      color: #777;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .summary-item {
      background: #f2f3f5;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 8px;
      border-bottom: 1px solid #eee;
      text-align: center;
      font-size: 14px;
    }

    th {
      background: #fafafa;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 18px;
    }

    .note {
      font-size: 13px;
      color: #777;
      line-height: 1.5;
      margin-top: 8px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>알바 근무시간 정리기</h1>
  <div class="sub">기간을 한 번에 만들고 필요한 날짜만 퇴근시간을 수정해요.</div>

  <div class="card">

    <h2>직원 관리</h2>

    <label>직원 이름</label>
    <input id="newEmployee" type="text" placeholder="예: 서윤">

    <button onclick="addEmployee()">직원 추가</button>

    <div id="employeeList" style="margin-top:16px;"></div>

  </div>


  <div class="card">

    <h2>기간 근무 입력</h2>

    <label>직원</label>

    <select id="employeeSelect">
      <option value="">직원을 선택하세요</option>
    </select>


    <label>포지션</label>

    <select id="position">
      <option value="오픈">오픈</option>
      <option value="미들">미들</option>
      <option value="마감">마감</option>
      <option value="기타">기타</option>
    </select>


    <label>근무 기간</label>

    <div class="date-range">

      <input
        id="startDate"
        type="date"
      >

      <input
        id="endDate"
        type="date"
      >

    </div>


    <label>기본 출근시간</label>

    <input
      id="defaultStart"
      type="time"
    >


    <label>기본 퇴근시간</label>

    <input
      id="defaultEnd"
      type="time"
    >


    <div class="note">
      기본 퇴근시간을 넣어두고 날짜를 만든 뒤,
      실제로 다르게 퇴근한 날짜만 수정하면 돼요.
    </div>


    <button onclick="generateDates()">
      날짜 만들기
    </button>

  </div>


  <div
    id="generatedCard"
    class="card"
    style="display:none;"
  >

    <h2>날짜별 퇴근시간</h2>

    <div class="note">
      퇴근시간이 기본시간과 다른 날만 바꿔주세요.
    </div>

    <div id="generatedList"></div>

    <button onclick="saveGeneratedWorks()">
      전체 근무 기록 저장
    </button>

  </div>


  <div class="card">

    <h2>월별 보기</h2>

    <div class="filter-row">

      <input
        id="monthFilter"
        type="month"
        onchange="renderWorks()"
      >

      <button
        class="secondary"
        style="margin:0;"
        onclick="clearFilter()"
      >
        전체 보기
      </button>

    </div>

  </div>


  <div class="card">

    <h2>직원별 합계</h2>

    <div id="summary">
      <div class="empty">
        아직 기록이 없어요.
      </div>
    </div>

  </div>


  <div class="card">

    <h2>근무 기록</h2>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>직원</th>
            <th>날짜</th>
            <th>포지션</th>
            <th>출근</th>
            <th>퇴근</th>
            <th>근무시간</th>
            <th>삭제</th>
          </tr>

        </thead>

        <tbody id="workList"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

let employees =
  JSON.parse(
    localStorage.getItem("employees") || "[]"
  );

let works =
  JSON.parse(
    localStorage.getItem("works") || "[]"
  );

let generatedWorks = [];


function saveEmployees() {

  localStorage.setItem(
    "employees",
    JSON.stringify(employees)
  );

}


function saveWorks() {

  localStorage.setItem(
    "works",
    JSON.stringify(works)
  );

}


function addEmployee() {

  const input =
    document.getElementById("newEmployee");

  const name =
    input.value.trim();


  if (!name) {

    alert("직원 이름을 입력해줘!");

    return;

  }


  if (employees.includes(name)) {

    alert("이미 등록된 직원이에요.");

    return;

  }


  employees.push(name);

  saveEmployees();

  input.value = "";

  renderEmployees();

}


function deleteEmployee(name) {

  if (
    !confirm(
      `${name} 직원을 목록에서 삭제할까요?\n기존 근무 기록은 그대로 남아요.`
    )
  ) {
    return;
  }


  employees =
    employees.filter(
      item => item !== name
    );


  saveEmployees();

  renderEmployees();

}


function renderEmployees() {

  const list =
    document.getElementById("employeeList");

  const select =
    document.getElementById("employeeSelect");


  list.innerHTML = "";

  select.innerHTML =
    `<option value="">직원을 선택하세요</option>`;


  if (employees.length === 0) {

    list.innerHTML =
      `<div class="empty">직원을 먼저 추가해주세요.</div>`;

  }


  employees.forEach(name => {

    const row =
      document.createElement("div");

    row.className =
      "employee-row";


    row.innerHTML = `

      <div class="employee-name">
        ${name}
      </div>

      <button
        class="delete"
        onclick="deleteEmployee('${name}')"
      >
        삭제
      </button>

    `;


    list.appendChild(row);


    const option =
      document.createElement("option");

    option.value = name;

    option.textContent = name;

    select.appendChild(option);

  });

}


function getDatesBetween(start, end) {

  const dates = [];

  const current =
    new Date(start + "T00:00:00");

  const last =
    new Date(end + "T00:00:00");


  while (current <= last) {

    const year =
      current.getFullYear();

    const month =
      String(
        current.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        current.getDate()
      ).padStart(2, "0");


    dates.push(
      `${year}-${month}-${day}`
    );


    current.setDate(
      current.getDate() + 1
    );

  }


  return dates;

}


function generateDates() {

  const employee =
    document.getElementById(
      "employeeSelect"
    ).value;

  const position =
    document.getElementById(
      "position"
    ).value;

  const startDate =
    document.getElementById(
      "startDate"
    ).value;

  const endDate =
    document.getElementById(
      "endDate"
    ).value;

  const defaultStart =
    document.getElementById(
      "defaultStart"
    ).value;

  const defaultEnd =
    document.getElementById(
      "defaultEnd"
    ).value;


  if (
    !employee ||
    !startDate ||
    !endDate ||
    !defaultStart ||
    !defaultEnd
  ) {

    alert(
      "직원, 기간, 출근시간, 퇴근시간을 모두 입력해줘!"
    );

    return;

  }


  if (startDate > endDate) {

    alert(
      "시작 날짜와 종료 날짜를 확인해줘!"
    );

    return;

  }


  const dates =
    getDatesBetween(
      startDate,
      endDate
    );


  generatedWorks =
    dates.map(date => ({

      date,

      employee,

      position,

      start: defaultStart,

      end: defaultEnd

    }));


  renderGenerated();

}


function renderGenerated() {

  const card =
    document.getElementById(
      "generatedCard"
    );

  const list =
    document.getElementById(
      "generatedList"
    );


  card.style.display = "block";

  list.innerHTML = "";


  generatedWorks.forEach(
    (item, index) => {

      const row =
        document.createElement("div");


      row.className =
        "generated-row";


      row.innerHTML = `

        <div class="generated-date">
          ${formatDate(item.date)}
        </div>

        <div class="generated-info">
          ${item.employee}
          · ${item.position}
          · 출근 ${item.start}
        </div>

        <label style="margin-top:8px;">
          실제 퇴근시간
        </label>

        <input
          type="time"
          value="${item.end}"
          onchange="changeGeneratedEnd(${index}, this.value)"
        >

      `;


      list.appendChild(row);

    });

}


function changeGeneratedEnd(
  index,
  value
) {

  generatedWorks[index].end =
    value;

}


function saveGeneratedWorks() {

  if (generatedWorks.length === 0) {

    alert("먼저 날짜를 만들어줘!");

    return;

  }


  generatedWorks.forEach(item => {

    const total =
      calculateWorkMinutes(
        item.start,
        item.end
      );


    works.push({

      id:
        Date.now()
        +
        Math.floor(
          Math.random() * 100000
        ),

      name:
        item.employee,

      date:
        item.date,

      position:
        item.position,

      start:
        item.start,

      end:
        item.end,

      total

    });

  });


  saveWorks();


  generatedWorks = [];


  document.getElementById(
    "generatedCard"
  ).style.display = "none";


  alert(
    "근무 기록이 한 번에 저장됐어요!"
  );


  renderWorks();

}


function calculateWorkMinutes(
  start,
  end
) {

  const [sh, sm] =
    start.split(":").map(Number);

  const [eh, em] =
    end.split(":").map(Number);


  let startMin =
    sh * 60 + sm;

  let endMin =
    eh * 60 + em;


  if (endMin < startMin) {

    endMin += 1440;

  }


  return endMin - startMin;

}


function formatMinutes(minutes) {

  const h =
    Math.floor(
      minutes / 60
    );

  const m =
    minutes % 60;


  if (h && m)
    return `${h}시간 ${m}분`;

  if (h)
    return `${h}시간`;

  return `${m}분`;

}


function formatDate(date) {

  const parts =
    date.split("-");

  return (
    Number(parts[1])
    +
    "월 "
    +
    Number(parts[2])
    +
    "일"
  );

}


function deleteWork(id) {

  if (
    !confirm(
      "이 근무 기록을 삭제할까요?"
    )
  ) {
    return;
  }


  works =
    works.filter(
      item =>
        item.id !== id
    );


  saveWorks();

  renderWorks();

}


function clearFilter() {

  document.getElementById(
    "monthFilter"
  ).value = "";

  renderWorks();

}


function renderWorks() {

  const workList =
    document.getElementById(
      "workList"
    );

  const summary =
    document.getElementById(
      "summary"
    );

  const monthFilter =
    document.getElementById(
      "monthFilter"
    ).value;


  let filtered =
    [...works];


  if (monthFilter) {

    filtered =
      works.filter(
        item =>
          item.date.startsWith(
            monthFilter
          )
      );

  }


  filtered.sort(
    (a, b) =>
      a.date.localeCompare(
        b.date
      )
  );


  workList.innerHTML = "";


  if (filtered.length === 0) {

    workList.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="empty"
        >
          기록이 없어요.
        </td>

      </tr>

    `;

  }


  filtered.forEach(item => {

    const tr =
      document.createElement(
        "tr"
      );


    tr.innerHTML = `

      <td>${item.name}</td>

      <td>
        ${formatDate(item.date)}
      </td>

      <td>
        ${item.position || "-"}
      </td>

      <td>${item.start}</td>

      <td>${item.end}</td>

      <td>
        ${formatMinutes(item.total)}
      </td>

      <td>

        <button
          class="delete"
          onclick="deleteWork(${item.id})"
        >
          삭제
        </button>

      </td>

    `;


    workList.appendChild(tr);

  });


  const totals = {};


  filtered.forEach(item => {

    if (!totals[item.name]) {

      totals[item.name] = 0;

    }


    totals[item.name] +=
      item.total;

  });


  summary.innerHTML = "";


  const names =
    Object.keys(totals);


  if (names.length === 0) {

    summary.innerHTML = `

      <div class="empty">
        아직 기록이 없어요.
      </div>

    `;

    return;

  }


  names.forEach(name => {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "summary-item";


    div.innerHTML = `

      <strong>${name}</strong>

      <br>

      총 근무
      ${formatMinutes(
        totals[name]
      )}

    `;


    summary.appendChild(div);

  });

}


renderEmployees();

renderWorks();

</script>

</body>
</html>
